[package]
name = "async-download-manager"
version = "0.1.0"
edition = "2021"
authors = ["Kuzma-Dev <kuzma@example.com>"]
description = "High-performance asynchronous video download manager with Tokio runtime"
license = "MIT"
repository = "https://github.com/Kuzma-Dev/async-download-manager"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1.5"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4"] }
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.0"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[[bin]]
name = "async-download-manager"
path = "src/main.rs"
